<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Page Not Found</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Mono:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="grid-overlay" aria-hidden="true"></div>

  <nav class="nav">
    <div class="nav-logo" id="heroSub" aria-live="polite">
    </div>
    <div class="nav-right">
      <div class="status-pill">
        <div class="status-dot"></div>
        ROUTE NOT FOUND
      </div>
      <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode"></button>
    </div>
  </nav>

  <div class="hero">
    <div class="big-404">
      <span class="four-accent">4</span>0<span class="four-accent">4</span>
    </div>
    <p class="hero-headline">
      This page has <strong>drifted out of orbit.</strong><br>
      The route you followed doesn&rsquo;t exist in this cluster.
    </p>
    <div class="cta-row">
      <a href="/" class="btn btn-primary">Back to Home</a>
      <a href="/contact" class="btn btn-ghost">Contact Support</a>
    </div>
  </div>

  <section class="playground-section">

  </section>

  <script src="index.js"></script>
</body>
</html>
